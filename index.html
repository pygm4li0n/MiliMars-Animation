<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MILIMARS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --accent: #39FF14; --glow: rgba(57,255,20,.5); --gap: clamp(18px, 5.5vh, 56px); --border: #1c1c1c; --muted: #6a6a6a; }
html, body { height: 100%; }
body { background: #020202; color: #fff; overflow: hidden; -webkit-font-smoothing: antialiased; font-family: 'Space Mono', monospace; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ═════ LANDING ═════ */
.landing {
  position: relative; height: 100dvh; display: flex; flex-direction: column;
  justify-content: center; align-items: center; overflow: hidden; isolation: isolate;
  background: radial-gradient(ellipse 80% 60% at 50% 50%, #0f1c0f 0%, #040804 55%, #020202 100%);
}
.bg-glow {
  position: absolute; left: 50%; top: 50%; width: min(120vw, 1300px); height: min(70vh, 640px); z-index: 0; pointer-events: none;
  transform: translate(-50%, -50%); border-radius: 50%;
  background: radial-gradient(closest-side, rgba(57,255,20,.34), rgba(57,255,20,.08) 55%, transparent 100%);
  animation: pulse 4.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: .65; transform: translate(-50%,-50%) scale(.94); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.06); } }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

.logo-wrap { position: relative; z-index: 4; flex-shrink: 0; pointer-events: none; }
.logo {
  display: block; width: clamp(260px, 56vw, 720px); height: auto; pointer-events: auto; cursor: pointer;
  filter: drop-shadow(0 0 40px rgba(57,255,20,.75)) drop-shadow(0 0 120px rgba(57,255,20,.45)) drop-shadow(0 24px 30px rgba(0,0,0,.85));
  animation: float 5s ease-in-out infinite;
}
@keyframes float { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.025); } }

.row {
  position: relative; z-index: 2; width: 112vw; margin-left: -6vw; overflow: hidden; flex-shrink: 0;
  padding: clamp(14px, 3.4vh, 34px) 0;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
}
#rowTop    { margin-bottom: calc(var(--gap) * -1); transform: rotate(-1.6deg); }
#rowBottom { margin-top:    calc(var(--gap) * -1); transform: rotate(-1.6deg); }
.track { display: flex; width: max-content; animation: left 70s linear infinite; will-change: transform; }
.row.right .track { animation-name: right; }
@keyframes left  { from { transform: translate3d(0,0,0); }    to { transform: translate3d(-50%,0,0); } }
@keyframes right { from { transform: translate3d(-50%,0,0); } to { transform: translate3d(0,0,0); } }
.row:hover .track, body.open .track { animation-play-state: paused; }

.shirt {
  position: relative; flex-shrink: 0; width: clamp(130px, 33vh, 360px); margin: 0 clamp(2px, .8vw, 14px);
  transition: transform .35s cubic-bezier(.2,.9,.4,1), filter .35s;
  filter: drop-shadow(0 0 14px rgba(57,255,20,.35)) drop-shadow(0 14px 18px rgba(0,0,0,.6));
}
.shirt:hover, .shirt:focus-visible {
  transform: scale(1.14); z-index: 6; outline: none;
  filter: drop-shadow(0 0 26px rgba(57,255,20,.95)) drop-shadow(0 18px 26px rgba(0,0,0,.7));
}
.sh { position: relative; display: block; width: 100%; }
.sh img.base { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
.sh img.design { position: absolute; left: 29%; top: 24%; width: 42%; height: auto; pointer-events: none; }
.shirt .sh { --r: 3deg; animation: bob 5.5s ease-in-out infinite; }
.shirt:nth-child(even) .sh { --r: -3deg; animation-duration: 6.5s; }
.shirt:nth-child(3n) .sh { animation-delay: -1.8s; }
.shirt:nth-child(3n+1) .sh { animation-delay: -3.6s; }
@keyframes bob {
  0%,100% { transform: translateY(0) rotate(var(--r)); }
  50%     { transform: translateY(-1.6vh) rotate(calc(var(--r) * -1)); }
}

/* ── stage ── */
#stage {
  position: fixed; inset: 0; z-index: 20; display: none; opacity: 0; cursor: zoom-out;
  background: radial-gradient(ellipse at 50% 50%, rgba(20,40,20,.97) 0%, rgba(2,2,2,.98) 75%);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: opacity .5s ease;
}
#stage.on { display: block; }
#stage.show { opacity: 1; }
#stage .sh {
  position: fixed; width: auto; transition: left .6s cubic-bezier(.2,.8,.2,1), top .6s cubic-bezier(.2,.8,.2,1),
  width .6s cubic-bezier(.2,.8,.2,1), height .6s cubic-bezier(.2,.8,.2,1);
  filter: drop-shadow(0 30px 50px rgba(0,0,0,.7)) drop-shadow(0 0 50px rgba(57,255,20,.3));
}
#stage .sh img.base { height: 100%; }

/* ═════ ADMIN ═════ */
#adminOverlay {
  position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 20px;
  background: rgba(0,0,0,.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#adminOverlay.open { display: flex; }
.card { width: 100%; background: #0b0b0b; border: 1px solid rgba(57,255,20,.25); border-radius: 18px; }
.login-card { max-width: 380px; padding: 26px 24px; }
.card h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: 1.5px; line-height: 1; margin-bottom: 6px; }
.card p.sub { font-size: .7rem; color: var(--muted); margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: .55rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.field input { background: #111; border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; color: #fff; font: inherit; font-size: .8rem; outline: none; width: 100%; }
.field input:focus { border-color: rgba(57,255,20,.6); box-shadow: 0 0 0 3px rgba(57,255,20,.12); }
.btn { font-size: .6rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; padding: 11px 20px; border-radius: 40px; transition: .2s; border: 1px solid var(--border); color: #B0B0B0; }
.btn:hover { border-color: rgba(57,255,20,.5); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #000; }
.btn.primary:hover { background: #6eff44; color: #000; box-shadow: 0 0 22px var(--glow); }
.btn.danger:hover { border-color: rgba(255,77,77,.6); color: #ff8a8a; }
.btn.sm { padding: 8px 12px; font-size: .52rem; letter-spacing: 1px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.msg { display: none; margin-bottom: 12px; padding: 8px 12px; border-radius: 8px; font-size: .62rem; letter-spacing: 1px; }
.msg.show { display: block; }
.msg.error { background: rgba(255,77,77,.1); border: 1px solid rgba(255,77,77,.4); color: #ff8a8a; }
.msg.success, .msg.info { background: rgba(57,255,20,.1); border: 1px solid rgba(57,255,20,.35); color: var(--accent); }

.panel { max-width: 1000px; max-height: 90dvh; overflow-y: auto; padding: 24px; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.panel-head small { font-size: .65rem; color: var(--muted); }
.ad-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.ad-item { background: #0f0f0f; border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.ad-thumb { background: radial-gradient(circle at 50% 40%, #1a241a, #0a0a0a); border-radius: 10px; padding: 10px; }
.ad-thumb .sh { width: 100%; max-width: 130px; margin: 0 auto; }
.ad-top { display: flex; justify-content: space-between; align-items: center; font-size: .55rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.ad-top b { color: var(--accent); font-weight: 700; }
.ad-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.ad-btns .btn { flex: 1 1 auto; text-align: center; }
.ad-btns .btn.icon { flex: 0 0 auto; padding: 8px 11px; }
.ad-empty { grid-column: 1 / -1; padding: 22px; text-align: center; border: 1px dashed var(--border); border-radius: 12px; font-size: .65rem; color: var(--muted); }
@media (max-width: 560px) { .panel { padding: 16px; } }
</style>
</head>

  var sb = null;
  try { if (window.supabase && window.supabase.createClient) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  catch (e) { console.warn("Supabase init", e); }

  /* ═════ ESTADO ═════
     shirt = { id, color: "white"|"black", design: url|"" (PNG sobre el pecho), img: url|"" (reemplaza la imagen completa) } */
  var shirts = [];
  var $ = function (id) { return document.getElementById(id); };

  function defaults() {
    var l = [];
    for (var i = 0; i < 12; i++) l.push({ id: "s" + (i + 1), color: i % 2 === 0 ? "white" : "black", design: "", img: "" });
    return l;
  }
  function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]; }); }

  /* ═════ DATOS ═════ */
  async function load() {
    if (sb) {
      try {
        var r = await sb.from(TABLE).select("value").eq("key", ROW_KEY).maybeSingle();
        if (r.error) throw r.error;
        if (r.data && Array.isArray(r.data.value) && r.data.value.length) return r.data.value;
      } catch (e) { console.warn("Supabase load → local", e); }
    }
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) { var p = JSON.parse(raw); if (Array.isArray(p) && p.length) return p; }
    } catch (e) {}
    return null;
  }
  async function persist() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(shirts)); } catch (e) {}
    if (sb) {
      try {
        var r = await sb.from(TABLE).upsert({ key: ROW_KEY, value: shirts });
        if (r.error) throw r.error;
        return true;
      } catch (e) { adminMsg("No se pudo guardar en Supabase: " + (e.message || e), "error"); return false; }
    }
    return true;
  }

  /* ═════ RENDER LANDING ═════ */
  function shSrc(s) { return s.img || IMG[s.color]; }
  function shHTML(s) {
    return '<span class="sh"><img class="base" src="' + esc(shSrc(s)) + '" alt="" draggable="false">' +
      (s.design ? '<img class="design" src="' + esc(s.design) + '" alt="">' : '') + '</span>';
  }
  function rowItems(offset) {
    var n = shirts.length, out = [];
    if (!n) return out;
    var o = offset % n, list = shirts.slice(o).concat(shirts.slice(0, o));
    while (out.length < 14) out = out.concat(list);
    return out;
  }
  function buildRow(rowId, offset) {
    var html = rowItems(offset).map(function (s) {
      return '<button type="button" class="shirt" data-id="' + esc(s.id) + '" aria-label="Ver remera ' + (s.color === "white" ? "blanca" : "negra") + '">' + shHTML(s) + '</button>';
    }).join("");
    document.querySelector("#" + rowId + " .track").innerHTML = html + html; /* duplicado = loop sin cortes */
  }
  function render() { buildRow("rowTop", 0); buildRow("rowBottom", 1); }

  /* ═════ CLICK: remera al centro ═════ */
  var stage = $("stage"), current = null, busy = false;

  function ratioOf(btn) {
    var im = btn.querySelector("img.base");
    return im && im.naturalWidth ? im.naturalHeight / im.naturalWidth : 1;
  }
  function targetRect(r) {
    var h = Math.min(innerHeight * 0.82, innerWidth * 0.92 * r), w = h / r;
    return { left: (innerWidth - w) / 2, top: (innerHeight - h) / 2, width: w, height: h };
  }
  function place(el, r) { el.style.left = r.left + "px"; el.style.top = r.top + "px"; el.style.width = r.width + "px"; el.style.height = r.height + "px"; }

  function openShirt(btn) {
    if (busy || current) return;
    busy = true;
    var id = btn.getAttribute("data-id");
    var data = shirts.filter(function (s) { return s.id === id; })[0];
    if (!data) { busy = false; return; }
    window.milimarsPick = id;
    var r = ratioOf(btn), from = btn.querySelector(".sh").getBoundingClientRect();
    stage.innerHTML = shHTML(data);
    var clone = stage.firstChild;
    place(clone, { left: from.left, top: from.top, width: from.width, height: from.height });
    clone.style.transition = "none";
    document.body.classList.add("open");
    btn.style.visibility = "hidden";
    stage.classList.add("on");
    void stage.offsetWidth;
    clone.style.transition = "";
    stage.classList.add("show");
    place(clone, targetRect(r));
    current = { btn: btn, clone: clone, ratio: r };
    setTimeout(function () { busy = false; }, 620);
  }
  function closeShirt() {
    if (!current || busy) return;
    busy = true;
    var c = current, back = c.btn.querySelector(".sh").getBoundingClientRect();
    stage.classList.remove("show");
    place(c.clone, back);
    setTimeout(function () {
      c.btn.style.visibility = "";
      stage.classList.remove("on"); stage.innerHTML = "";
      document.body.classList.remove("open");
      current = null; busy = false;
    }, 620);
  }
  $("landing").addEventListener("click", function (ev) {
    var b = ev.target.closest(".shirt");
    if (b) openShirt(b);
  });
  stage.addEventListener("click", closeShirt);
  addEventListener("resize", function () { if (current && !busy) place(current.clone, targetRect(current.ratio)); });

  /* ═════ ADMIN ═════ */
  var msgTimer = null, pending = null;
  function isLogged() { try { return sessionStorage.getItem(SESSION_KEY) === "1"; } catch (e) { return false; } }
  function setLogged(v) { try { v ? sessionStorage.setItem(SESSION_KEY, "1") : sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
  function showMsg(el, text, type) {
    el.textContent = text; el.className = "msg show " + (type || "info");
    clearTimeout(msgTimer); msgTimer = setTimeout(function () { el.className = "msg"; el.textContent = ""; }, 4000);
  }
  function adminMsg(t, ty) { showMsg($("adminMsg"), t, ty); }

  function openAdmin() {
    $("adminOverlay").classList.add("open");
    if (isLogged()) showPanel(); else showLogin();
  }
  function closeAdmin() { $("adminOverlay").classList.remove("open"); $("loginForm").reset(); }
  function showLogin() {
    $("loginCard").style.display = ""; $("adminPanel").style.display = "none";
    setTimeout(function () { $("loginUser").focus(); }, 50);
  }
  function showPanel() { $("loginCard").style.display = "none"; $("adminPanel").style.display = ""; renderAdmin(); }

  function renderAdmin() {
    var list = $("adList");
    if (!shirts.length) { list.innerHTML = '<p class="ad-empty">No hay remeras. Agregá una blanca o negra.</p>'; return; }
    list.innerHTML = shirts.map(function (s, i) {
      var id = esc(s.id);
      return '<div class="ad-item" data-id="' + id + '">' +
        '<div class="ad-top"><span>#' + (i + 1) + ' · ' + (s.color === "white" ? "Blanca" : "Negra") + '</span>' +
        '<b>' + (s.design ? "DISEÑO ✓" : "") + (s.img ? " IMG ✓" : "") + '</b></div>' +
        '<div class="ad-thumb">' + shHTML(s) + '</div>' +
        '<div class="ad-btns">' +
          '<button type="button" class="btn sm primary" data-act="design">Diseño PNG</button>' +
          '<button type="button" class="btn sm" data-act="image">Reemplazar imagen</button>' +
        '</div>' +
        '<div class="ad-btns">' +
          (s.design ? '<button type="button" class="btn sm" data-act="rmdesign">Quitar diseño</button>' : '') +
          (s.img ? '<button type="button" class="btn sm" data-act="rmimage">Imagen original</button>' : '') +
          '<button type="button" class="btn sm icon" data-act="up"' + (i === 0 ? " disabled" : "") + ' title="Subir">↑</button>' +
          '<button type="button" class="btn sm icon" data-act="down"' + (i === shirts.length - 1 ? " disabled" : "") + ' title="Bajar">↓</button>' +
          '<button type="button" class="btn sm icon danger" data-act="del" title="Eliminar">✕</button>' +
        '</div></div>';
    }).join("");
  }

  async function commit(okText) {
    render(); renderAdmin();
    if (await persist()) adminMsg(okText, "success");
  }

  /* lee un archivo y lo devuelve como dataURL con transparencia (sin fondo negro) */
  function fileToDataURL(file, maxW, type, q) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type)) { reject(new Error("El archivo no es una imagen")); return; }
      var fr = new FileReader();
      fr.onload = function (e) {
        var im = new Image();
        im.onload = function () {
          var w = im.naturalWidth, h = im.naturalHeight;
          if (!w || !h) { reject(new Error("No se pudo leer la imagen")); return; }
          if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
          var c = document.createElement("canvas"); c.width = w; c.height = h;
          c.getContext("2d").drawImage(im, 0, 0, w, h);
          try { resolve(c.toDataURL(type, q)); } catch (err) { reject(new Error("No se pudo procesar la imagen")); }
        };
        im.onerror = function () { reject(new Error("No se pudo leer la imagen")); };
        im.src = e.target.result;
      };
      fr.onerror = function () { reject(new Error("No se pudo leer el archivo")); };
      fr.readAsDataURL(file);
    });
  }
  /* sube a Storage si existe el bucket; si no, queda como dataURL dentro de la fila */
  async function maybeUpload(dataUrl) {
    if (!sb || !BUCKET) return dataUrl;
    try {
      var blob = await (await fetch(dataUrl)).blob();
      var ext = blob.type === "image/webp" ? "webp" : "png";
      var path = "landing/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
      var up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type, upsert: false });
      if (up.error) throw up.error;
      return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    } catch (e) { console.warn("Storage → dataURL", e); return dataUrl; }
  }

  async function handleFile(file) {
    if (!pending || !file) return;
    var p = pending; pending = null;
    var s = shirts.filter(function (x) { return x.id === p.id; })[0];
    if (!s) return;
    adminMsg("Procesando imagen…", "info");
    try {
      var isDesign = p.kind === "design";
      var data = await fileToDataURL(file, isDesign ? 900 : 700, isDesign ? "image/png" : "image/webp", 0.9);
      var url = await maybeUpload(data);
      if (isDesign) s.design = url; else s.img = url;
      await commit(isDesign ? "Diseño aplicado" : "Imagen reemplazada");
    } catch (e) { adminMsg(e && e.message ? e.message : "No se pudo procesar", "error"); }
  }

  $("adList").addEventListener("click", async function (ev) {
    var btn = ev.target.closest("[data-act]");
    if (!btn || btn.disabled) return;
    var id = btn.closest(".ad-item").getAttribute("data-id"), act = btn.getAttribute("data-act");
    var i = shirts.findIndex(function (x) { return x.id === id; });
    if (i < 0) return;
    if (act === "design" || act === "image") { pending = { id: id, kind: act }; $("fileInput").click(); }
    else if (act === "rmdesign") { shirts[i].design = ""; await commit("Diseño quitado"); }
    else if (act === "rmimage") { shirts[i].img = ""; await commit("Imagen original restaurada"); }
    else if (act === "up" || act === "down") {
      var t = act === "up" ? i - 1 : i + 1;
      if (t < 0 || t >= shirts.length) return;
      var tmp = shirts[i]; shirts[i] = shirts[t]; shirts[t] = tmp;
      await commit("Orden actualizado");
    } else if (act === "del") {
      if (!confirm("¿Eliminar esta remera?")) return;
      shirts.splice(i, 1); await commit("Remera eliminada");
    }
  });
  $("fileInput").addEventListener("change", function (ev) { var f = ev.target.files && ev.target.files[0]; ev.target.value = ""; handleFile(f); });

  function addShirt(color) {
    shirts.push({ id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 4), color: color, design: "", img: "" });
    commit("Remera agregada");
  }
  $("addWhite").addEventListener("click", function () { addShirt("white"); });
  $("addBlack").addEventListener("click", function () { addShirt("black"); });

  $("loginForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if ($("loginUser").value.trim().toUpperCase() === ADMIN_USER && $("loginPass").value.trim() === ADMIN_PASS) {
      setLogged(true); showPanel(); adminMsg("Bienvenido", "success");
    } else {
      showMsg($("loginMsg"), "Usuario o contraseña incorrectos", "error");
      $("loginPass").value = ""; $("loginPass").focus();
    }
  });
  $("loginCancel").addEventListener("click", closeAdmin);
  $("closePanel").addEventListener("click", closeAdmin);
  $("logoutBtn").addEventListener("click", function () { setLogged(false); showLogin(); showMsg($("loginMsg"), "Sesión cerrada", "info"); });

  /* el botón MILIMARS (logo) abre el panel */
  $("logo").addEventListener("click", openAdmin);
  $("logo").addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openAdmin(); } });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { if ($("adminOverlay").classList.contains("open")) closeAdmin(); else closeShirt(); }
  });

  /* ═════ INIT ═════ */
  shirts = defaults();
  render();
  load().then(function (saved) {
    if (saved) { shirts = saved; render(); if (isLogged() && $("adminPanel").style.display !== "none") renderAdmin(); }
  });
})();
</script>

<script>
/* partículas ambientales (del sitio base) */
(function () {
  "use strict";
  var canvas = document.getElementById("fx");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, particles = [];
  var COLOR = "57, 255, 20";

  function seed() {
    var count = Math.min(80, Math.round((W * H) / 28000));
    particles = [];
    for (var i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.8 + 0.5,
        vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
        o: Math.random() * 0.5 + 0.2
      });
    }
  }
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed();
  }
  function paint(p) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(" + COLOR + ", " + p.o + ")";
    ctx.shadowColor = "rgba(" + COLOR + ", 0.8)";
    ctx.shadowBlur = 8;
    ctx.fill();
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10;
      if (p.y > H + 10) p.y = -10;
      paint(p);
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
