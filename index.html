<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MILIMARS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --accent: #39FF14; --glow: rgba(57,255,20,.5); --gap: clamp(18px, 5.5vh, 56px); }
html, body { height: 100%; }
body { background: #020202; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; background: none; border: 0; cursor: pointer; }

.landing {
  position: relative; height: 100dvh; display: flex; flex-direction: column;
  justify-content: center; align-items: center; overflow: hidden; isolation: isolate;
  background: radial-gradient(ellipse 80% 60% at 50% 50%, #0f1c0f 0%, #040804 55%, #020202 100%);
}
/* luz: rayos que giran + pulso detrás del logo */
.bg-rays {
  position: absolute; left: 50%; top: 50%; width: 190vmax; height: 190vmax; z-index: 0; pointer-events: none;
  transform: translate(-50%, -50%); animation: spin 80s linear infinite;
  background: repeating-conic-gradient(from 0deg, rgba(57,255,20,.085) 0deg 5deg, transparent 5deg 18deg);
  -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 38%);
          mask-image: radial-gradient(circle, #000 0%, transparent 38%);
}
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
.bg-glow {
  position: absolute; left: 50%; top: 50%; width: min(120vw, 1300px); height: min(70vh, 640px); z-index: 0; pointer-events: none;
  transform: translate(-50%, -50%); border-radius: 50%;
  background: radial-gradient(closest-side, rgba(57,255,20,.34), rgba(57,255,20,.08) 55%, transparent 100%);
  animation: pulse 4.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: .65; transform: translate(-50%,-50%) scale(.94); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.06); } }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

.logo-wrap { position: relative; z-index: 4; flex-shrink: 0; pointer-events: none; }
.logo {
  display: block; width: clamp(260px, 56vw, 720px); height: auto;
  filter: drop-shadow(0 0 40px rgba(57,255,20,.75)) drop-shadow(0 0 120px rgba(57,255,20,.45)) drop-shadow(0 24px 30px rgba(0,0,0,.85));
  animation: float 5s ease-in-out infinite;
}
@keyframes float { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.025); } }

/* filas: pegadas al logo, levemente inclinadas, en sentidos opuestos */
.row {
  position: relative; z-index: 2; width: 112vw; margin-left: -6vw; overflow: hidden; flex-shrink: 0;
  padding: clamp(14px, 3.4vh, 34px) 0;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
}
#rowTop    { margin-bottom: calc(var(--gap) * -1); transform: rotate(-1.6deg); }
#rowBottom { margin-top:    calc(var(--gap) * -1); transform: rotate(-1.6deg); }
.track { display: flex; width: max-content; animation: left 70s linear infinite; will-change: transform; }
.row.right .track { animation-name: right; }
@keyframes left  { from { transform: translate3d(0,0,0); }    to { transform: translate3d(-50%,0,0); } }
@keyframes right { from { transform: translate3d(-50%,0,0); } to { transform: translate3d(0,0,0); } }
.row:hover .track, body.open .track { animation-play-state: paused; }

.shirt {
  position: relative; flex-shrink: 0; width: clamp(130px, 33vh, 360px); margin: 0 clamp(2px, .8vw, 14px);
  transition: transform .35s cubic-bezier(.2,.9,.4,1), filter .35s;
  filter: drop-shadow(0 0 14px rgba(57,255,20,.35)) drop-shadow(0 14px 18px rgba(0,0,0,.6));
}
.shirt:hover, .shirt:focus-visible {
  transform: scale(1.14); z-index: 6; outline: none;
  filter: drop-shadow(0 0 26px rgba(57,255,20,.95)) drop-shadow(0 18px 26px rgba(0,0,0,.7));
}
.sh { position: relative; display: block; width: 100%; }
.sh img.base { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
.sh img.design { position: absolute; left: 29%; top: 24%; width: 42%; height: auto; pointer-events: none; }
/* cada remera flota y se inclina distinto */
.shirt .sh { --r: 3deg; animation: bob 5.5s ease-in-out infinite; }
.shirt:nth-child(even) .sh { --r: -3deg; animation-duration: 6.5s; }
.shirt:nth-child(3n) .sh { animation-delay: -1.8s; }
.shirt:nth-child(3n+1) .sh { animation-delay: -3.6s; }
@keyframes bob {
  0%,100% { transform: translateY(0) rotate(var(--r)); }
  50%     { transform: translateY(-1.6vh) rotate(calc(var(--r) * -1)); }
}

/* ── stage: remera al centro, grande y sola ── */
#stage {
  position: fixed; inset: 0; z-index: 20; display: none; opacity: 0; cursor: zoom-out;
  background: radial-gradient(ellipse at 50% 50%, rgba(20,40,20,.97) 0%, rgba(2,2,2,.98) 75%);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: opacity .5s ease;
}
#stage.on { display: block; }
#stage.show { opacity: 1; }
#stage .sh {
  position: fixed; width: auto; transition: left .6s cubic-bezier(.2,.8,.2,1), top .6s cubic-bezier(.2,.8,.2,1),
  width .6s cubic-bezier(.2,.8,.2,1), height .6s cubic-bezier(.2,.8,.2,1);
  filter: drop-shadow(0 30px 50px rgba(0,0,0,.7)) drop-shadow(0 0 50px rgba(57,255,20,.3));
}
#stage .sh img.base { height: 100%; }

</style>
</head>

    var list = [];
    for (var i = 0; i < 12; i++) {
      list.push({ id: prefix + (i + 1), color: (i % 2 === 0) === (startColor === "white") ? "white" : "black", design: "" });
    }
    return list;
  }
  var TOP    = make("A", "white");
  var BOTTOM = make("B", "black");

  var ratio = { white: 566 / 560, black: 574 / 560 };

  function shHTML(s) {
    return '<span class="sh"><img class="base" src="' + IMG[s.color] + '" alt="" draggable="false">' +
      (s.design ? '<img class="design" src="' + s.design + '" alt="">' : '') + '</span>';
  }

  function build(rowId, list) {
    var html = list.map(function (s) {
      return '<button type="button" class="shirt" data-id="' + s.id + '" data-color="' + s.color +
        '" aria-label="Ver remera ' + (s.color === "white" ? "blanca" : "negra") + '">' + shHTML(s) + '</button>';
    }).join("");
    var track = document.querySelector("#" + rowId + " .track");
    track.innerHTML = html + html; /* duplicado = loop sin cortes */
    track._data = list;
  }
  build("rowTop", TOP);
  build("rowBottom", BOTTOM);

  /* ── click: la remera viaja al centro, grande y sola ── */
  var stage = document.getElementById("stage");
  var current = null; /* {btn, clone, data} */
  var busy = false;

  function targetRect(color) {
    var r = ratio[color];
    var h = Math.min(window.innerHeight * 0.82, window.innerWidth * 0.92 * r);
    var w = h / r;
    return { left: (window.innerWidth - w) / 2, top: (window.innerHeight - h) / 2, width: w, height: h };
  }
  function place(el, r) {
    el.style.left = r.left + "px"; el.style.top = r.top + "px";
    el.style.width = r.width + "px"; el.style.height = r.height + "px";
  }

  function openShirt(btn) {
    if (busy || current) return;
    busy = true;
    var id = btn.getAttribute("data-id"), color = btn.getAttribute("data-color");
    var data = (TOP.concat(BOTTOM)).filter(function (s) { return s.id === id; })[0];
    window.milimarsPick = id;

    var from = btn.querySelector(".sh").getBoundingClientRect();
    stage.innerHTML = shHTML(data);
    var clone = stage.firstChild;
    place(clone, { left: from.left, top: from.top, width: from.width, height: from.height });
    clone.style.transition = "none";

    document.body.classList.add("open");
    btn.style.visibility = "hidden";
    stage.classList.add("on");
    void stage.offsetWidth;
    clone.style.transition = "";
    stage.classList.add("show");
    place(clone, targetRect(color));

    current = { btn: btn, clone: clone, color: color };
    setTimeout(function () { busy = false; }, 620);
  }

  function closeShirt() {
    if (!current || busy) return;
    busy = true;
    var c = current;
    var back = c.btn.querySelector(".sh").getBoundingClientRect();
    stage.classList.remove("show");
    place(c.clone, back);
    setTimeout(function () {
      c.btn.style.visibility = "";
      stage.classList.remove("on");
      stage.innerHTML = "";
      document.body.classList.remove("open");
      current = null; busy = false;
    }, 620);
  }

  document.querySelector(".landing").addEventListener("click", function (ev) {
    var b = ev.target.closest(".shirt");
    if (b) openShirt(b);
  });
  stage.addEventListener("click", closeShirt);
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeShirt(); });
  window.addEventListener("resize", function () { if (current && !busy) place(current.clone, targetRect(current.color)); });
})();
</script>
<script>
/* partículas ambientales (del sitio base) */
(function () {
  "use strict";
  var canvas = document.getElementById("fx");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, particles = [];
  var COLOR = "57, 255, 20";

  function seed() {
    var count = Math.min(80, Math.round((W * H) / 28000));
    particles = [];
    for (var i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.8 + 0.5,
        vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
        o: Math.random() * 0.5 + 0.2
      });
    }
  }
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed();
  }
  function paint(p) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(" + COLOR + ", " + p.o + ")";
    ctx.shadowColor = "rgba(" + COLOR + ", 0.8)";
    ctx.shadowBlur = 8;
    ctx.fill();
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10;
      if (p.y > H + 10) p.y = -10;
      paint(p);
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
